name: Run sc-crawler pull

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Type of run to execute'
        required: true
        default: 'hourly'
        type: choice
        options:
          - hourly
          - frequent

jobs:
  crawl:
    permissions:
      # for the stefanzweifel/git-auto-commit-action step
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}
    env:
      TRACKER_PROJECT_NAME: sc-crawler
      TRACKER_ORCHESTRATOR: github-actions
      TRACKER_ENV: ci
      TRACKER_QUIET: "true"
      TRACKER_EXTERNAL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TRACKER_STAGE_NAME: ${{ github.workflow }}
      TRACKER_LANGUAGE: python
      TRACKER_JOB_NAME: crawl-${{ inputs.run_type }}
      BUCKET: sc-data-public-40e9d310
      FILE: sc-data-all.db
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      UPCLOUD_USERNAME: ${{ secrets.UPCLOUD_USERNAME }}
      UPCLOUD_PASSWORD: ${{ secrets.UPCLOUD_PASSWORD }}
      OVH_CLIENT_ID: ${{ secrets.OVH_CLIENT_ID }}
      OVH_CLIENT_SECRET: ${{ secrets.OVH_CLIENT_SECRET }}
      OVH_PROJECT_ID: ${{ secrets.OVH_PROJECT_ID }}
      OVH_ENDPOINT: ${{ vars.OVH_ENDPOINT }}
      OVH_SUBSIDIARY: ${{ vars.OVH_SUBSIDIARY }}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ALIBABA_CLOUD_REGION: ${{ vars.ALIBABA_CLOUD_REGION }}
      COLUMNS: 160
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
    steps:
      - name: Print Workflow Dispatch Inputs
        uses: shayki5/print-workflow-dispatch-inputs@1.0.2
        with:
          print_env_vars: 'false'
          add_to_summary: 'true'
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install resource-tracker
        run: bash .github/scripts/install-resource-tracker.sh
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Cache uv
        uses: actions/cache@v5.0.5
        with:
          key: uv
          path: ~/.cache/uv
      - name: Install uv
        uses: yezz123/setup-uv@v4.1
        with:
          uv-venv: "sc_data"
      - name: Set up Python dependencies
        run: |
          uv pip install psycopg2
          uv pip install "sparecores-crawler[all] @ git+https://github.com/SpareCores/sc-crawler"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.SC_DATA_ROLE_ARN }}
          role-session-name: sc-data-dumps-gha
          role-duration-seconds: 43200
          aws-region: us-east-1
      - name: Get Sentinel API token from SSM
        run: |
          SENTINEL_API_TOKEN="$(aws ssm get-parameter --name "/sentinel/api-tokens/public-benchmarks" --with-decryption --region us-east-1 --query 'Parameter.Value' --output text)"
          echo "::add-mask::$SENTINEL_API_TOKEN"
          echo "SENTINEL_API_TOKEN=$SENTINEL_API_TOKEN" >> "$GITHUB_ENV"
      - name: Configure GCP credentials
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_JSON_KEY }}'

      - name: Load cached SQLite file
        id: cache-sqlite-restore
        uses: actions/cache/restore@v5.0.5
        with:
          key: sc-data-current-sqlite
          path: sc-data-all.db

      - name: Build connection string for remote database
        run: |
          # URL-encode the password for the libpq connection URI
          DB_PASS_ENCODED="$( jq -rn --arg x "${DB_PASSWORD}" '$x|@uri' )"
          REMOTE_DB="postgresql://${DB_USER}:${DB_PASS_ENCODED}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require"
          echo "::add-mask::$REMOTE_DB"
          echo "REMOTE_DB=${REMOTE_DB}" >> "$GITHUB_ENV"
      - name: Get current database hourly or if not cached
        if: (github.event_name == 'workflow_dispatch' && inputs.run_type == 'hourly') || steps.cache-sqlite-restore.outputs.cache-hit != 'true'
        env:
          TRACKER_TASK_NAME: copy
        run: |
          rm -f ${FILE}
          bash .github/scripts/run-with-resource-tracker.sh sc-crawler copy --source ${REMOTE_DB} --target sqlite:///${FILE}

      - name: Run SC Crawler on all resources once an hour or on manual request
        if: (github.event_name == 'workflow_dispatch' && inputs.run_type == 'hourly')
        env:
          TRACKER_TASK_NAME: pull
        run: bash .github/scripts/run-with-resource-tracker.sh sc-crawler pull --connection-string sqlite:///${FILE}
      - name: Run SC Crawler only for spot prices
        if: (github.event_name == 'workflow_dispatch' && inputs.run_type == 'frequent')
        # Azure Retail Pricing API is super slow, let's delay checking on their spot prices only in the hourly run
        env:
          TRACKER_TASK_NAME: pull-spot
        run: bash .github/scripts/run-with-resource-tracker.sh sc-crawler pull --connection-string sqlite:///${FILE} --include-records server_prices_spot --exclude-vendor azure

      - name: Sync back (all records)
        if: (github.event_name == 'workflow_dispatch' && inputs.run_type == 'hourly')
        env:
          TRACKER_TASK_NAME: sync
        run: |
          bash .github/scripts/run-with-resource-tracker.sh sc-crawler sync --source sqlite:///${FILE} --target ${REMOTE_DB} --scd --log-changes-path changes.log --log-changes-tables country --log-changes-tables compliance_framework --log-changes-tables vendor --log-changes-tables vendor_compliance_link --log-changes-tables region --log-changes-tables zone --log-changes-tables storage --log-changes-tables server --log-changes-tables benchmark
      - name: Sync back (server prices only)
        if: (github.event_name == 'workflow_dispatch' && inputs.run_type == 'frequent')
        env:
          TRACKER_TASK_NAME: sync-spot
        run: |
          bash .github/scripts/run-with-resource-tracker.sh sc-crawler sync --source sqlite:///${FILE} --target ${REMOTE_DB} --scd --sync-tables server_price
          touch changes.log

      - name: Upload binary SQLite file if changed
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          CDN_BUCKET: ${{ vars.CDN_BUCKET }}
        run: |
          VERSION=$(python -c "import sc_crawler; v=sc_crawler.__version_info__; print(f'{v[0]}.{v[1]}')")
          echo "Crawler version (major.minor) for CDN paths: $VERSION"
          echo "Comparing data hashes in S3 and local file to determine if we need to upload..."
          RHASH=$(aws s3api head-object --bucket $BUCKET --key $FILE.bz2 --query "Metadata.hash" --output=text)
          echo "Last known hash in S3: $RHASH"
          LHASH=$(sc-crawler hash --connection-string sqlite:///$FILE)
          echo "Currently pulled database's hash: $LHASH"
          if [ "$LHASH" != "$RHASH" ]; then
            echo "VACUUMing $FILE..."
            sqlite3 $FILE "VACUUM;"
            echo "Dumping schema and data to single file..."
            sqlite3 $FILE .dump > sc-data-all.sql
            echo "Compressing dump..."
            xz -9ek -T1 sc-data-all.sql
            echo "Uploading dump to CDN bucket (versioned and latest)..."
            aws s3 cp sc-data-all.sql.xz "s3://$CDN_BUCKET/sc-data/$VERSION/sc-data-all.sql.xz" --metadata="hash=$LHASH"
            aws s3 cp sc-data-all.sql.xz "s3://$CDN_BUCKET/sc-data/latest/sc-data-all.sql.xz" --metadata="hash=$LHASH"
            echo "Compressing $FILE..."
            bzip2 -k -9 "$FILE"
            echo "Uploading $FILE to S3..."
            aws s3 cp "$FILE".bz2 "s3://$BUCKET/$FILE".bz2 --metadata="hash=$LHASH"
          fi

          FILE="sc-data-priceless.db"
          echo "Truncating $FILE..."
          cp sc-data-all.db $FILE
          sqlite3 $FILE "
            DELETE FROM server_price;
            DELETE FROM storage_price;
            DELETE FROM traffic_price;
            DELETE FROM ipv4_price;
            DELETE FROM benchmark_score;
            VACUUM;"
          echo "Dumping $FILE to JSON files..."
          find data -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          sc-crawler dump \
            --connection-string "sqlite:///$FILE" \
            --ignored inserted_at \
            --ignored updated_at \
            --ignored observed_at \
            --dump-tables benchmark \
            --dump-tables compliance_framework \
            --dump-tables country \
            --dump-tables region \
            --dump-tables server \
            --dump-tables storage \
            --dump-tables vendor \
            --dump-tables zone \
            --dump-tables zzz_alembic_version \
            --output-directory "data"

          echo "Calculating hash for priceless database..."
          PRICELESS_HASH=$(sc-crawler hash --connection-string sqlite:///$FILE)
          echo "Priceless database hash: $PRICELESS_HASH"
          echo "Dumping priceless database schema and data to single file..."
          sqlite3 $FILE .dump > sc-data-priceless.sql
          echo "Compressing priceless SQL dump..."
          xz -9ek -T1 sc-data-priceless.sql
          echo "Uploading priceless SQL dump to CDN bucket (versioned and latest)..."
          aws s3 cp sc-data-priceless.sql.xz "s3://$CDN_BUCKET/sc-data/$VERSION/sc-data-priceless.sql.xz" --metadata="hash=$PRICELESS_HASH"
          aws s3 cp sc-data-priceless.sql.xz "s3://$CDN_BUCKET/sc-data/latest/sc-data-priceless.sql.xz" --metadata="hash=$PRICELESS_HASH"

          echo "Checking for priceless database changes..."
          HAS_CHANGES=false
          git diff --quiet -- data/ 2>/dev/null || HAS_CHANGES=true
          git diff --cached --quiet -- data/ 2>/dev/null || HAS_CHANGES=true
          [ -z "$(git ls-files --others --exclude-standard -- data/ 2>/dev/null)" ] || HAS_CHANGES=true
          if [ "$HAS_CHANGES" = "true" ]; then
            # note on Slack
            GHARUNURL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"username\": \"Scompanion\", \"icon_emoji\": \":sparecores:\", \"text\": \"The sc-data-dumps repo was <$GHARUNURL|updated> with the following hash: $LHASH\"}" \
              $SLACK_WEBHOOK

            # update CHANGELOG
            CRAWLER_VERSION=$(python -c "from importlib.metadata import version; print(version('sparecores-crawler'))")
            DATE=$(date '+%Y%m%d%H%M%S')
            NEWVERSION="v$CRAWLER_VERSION+$DATE"
            NEWVERSIONDATE="$NEWVERSION ($(date '+%b %d, %Y'))"
            echo "## ${NEWVERSIONDATE}" > CHANGELOG.new
            CHANGESFOUND="\nThis is an automated release with $(cat changes.log| grep '^-'|wc -l) new/updated/deleted resources.\nJob was run at ${GHARUNURL}"
            echo -e "${CHANGESFOUND}" >> CHANGELOG.new
            echo "" >> CHANGELOG.new
            cat changes.log >> CHANGELOG.new
            echo "" >> CHANGELOG.new
            cat CHANGELOG.md >> CHANGELOG.new
            mv CHANGELOG.new CHANGELOG.md

            # record metadata of Python packages used and commit details
            jq -n \
              --arg crawler_version "$CRAWLER_VERSION" \
              --arg newversion "$NEWVERSION" \
              --arg newversiondate "$NEWVERSIONDATE" \
              --arg changesfound "$CHANGESFOUND" \
              --arg gharunurl "$GHARUNURL" \
              --arg python_version "$(python --version 2>&1 | cut -d' ' -f2)" \
              --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson pip_freeze "$(uv pip freeze | jq -R -s -c 'split("\n") | map(select(length > 0))')" \
              '{
                python_version: $python_version,
                pip_freeze: $pip_freeze,
                environment_variables: {
                  CRAWLER_VERSION: $crawler_version,
                  NEWVERSION: $newversion,
                  NEWVERSIONDATE: $newversiondate,
                  CHANGESFOUND: $changesfound,
                  GHARUNURL: $gharunurl
                },
                timestamp: $timestamp
              }' > data/last-run-info.json

            # pass required env vars and files for later steps
            echo "CRAWLER_VERSION=${CRAWLER_VERSION}" >> "$GITHUB_ENV"
            echo "CHANGESFOUND=${CHANGESFOUND}" >> "$GITHUB_ENV"
            echo "GHARUNURL=${GHARUNURL}" >> "$GITHUB_ENV"
            echo "NEWVERSION=${NEWVERSION}" >> "$GITHUB_ENV"
            echo "NEWVERSIONDATE=${NEWVERSIONDATE}" >> "$GITHUB_ENV"

          fi

      - name: Clear SQLite file cache
        if: steps.cache-sqlite-restore.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh cache delete sc-data-current-sqlite
      - name: Save SQLite file
        id: cache-sqlite-save
        uses: actions/cache/save@v5.0.5
        with:
          key: sc-data-current-sqlite
          path: sc-data-all.db

      - name: Generate the commit message
        id: generate-commit-message
        run: |
          echo "tag=$NEWVERSION" >> $GITHUB_OUTPUT
          echo 'message<<EOF' >> $GITHUB_OUTPUT
          echo -e "$CHANGESFOUND\n\n" >> $GITHUB_OUTPUT
          cat changes.log >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          git pull
      - name: Commit changes to the repo
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        id: auto-commit-action
        with:
          commit_message: ${{ steps.generate-commit-message.outputs.message }}
          file_pattern: "CHANGELOG.md data/**"
          tagging_message: ${{ steps.generate-commit-message.outputs.tag }}
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Archive data for debugging
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-and-changes
          compression-level: 0
          path: |
            changes.log
            data/

      - name: Notify Spare Cores statuspage monitoring that the job run
        run: curl -s https://uptime.betterstack.com/api/v1/heartbeat/NTnwVC261MyrLnevn4WJc5Jh
