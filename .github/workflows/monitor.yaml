name: Nudge crawl runs

on:
  schedule:
    - cron: "*/5 * * * *"
    # for the keepalive workflow to run once a day
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  nudge:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # required to trigger workflows
      actions: write
    steps:
      - name: Check last runs and trigger if needed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FULL: crawl-full.yaml
          WORKFLOW_SPOT: crawl-spot.yaml
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          # <@slack_user_id> <@slack_user_id> ...
          SLACK_ALERT_MESSAGE: ${{ secrets.SLACK_ALERT_MESSAGE }}
        run: |
          fetch_runs() {
            curl -s -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$2" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$1/runs?per_page=10"
          }

          echo "Fetching recent workflow runs..."
          fetch_runs "$WORKFLOW_FULL" runs-full.json
          fetch_runs "$WORKFLOW_SPOT" runs-spot.json

          # notify team if all (3) recent runs failed across both workflows
          ALL_FAILED=$(jq -s '
            [.[].workflow_runs[]] |
            sort_by(.updated_at) | reverse |
            .[0:3] |
            length == 3 and all(.conclusion == "failure")
          ' runs-full.json runs-spot.json)
          if [ "$ALL_FAILED" = "true" ]; then
            echo "All recent runs failed, notifying team"
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"username\": \"Scompanion\", \"icon_emoji\": \":argh:\", \"text\": \"The crawler has been failing recently, please investigate: https://github.com/SpareCores/sc-data-dumps/actions/workflows/${WORKFLOW_FULL} and https://github.com/SpareCores/sc-data-dumps/actions/workflows/${WORKFLOW_SPOT}\n${SLACK_ALERT_MESSAGE}\"}" \
              $SLACK_WEBHOOK
          fi

          # early exit if any job is already in progress across either workflow
          IN_PROGRESS=$(jq -s 'any(.[].workflow_runs[]; .status == "in_progress" or .status == "queued")' runs-full.json runs-spot.json)
          if [ "$IN_PROGRESS" = "true" ]; then
            echo "Job is already running or scheduled, exiting"
            exit 0
          fi

          LAST_FULL=$(jq -r '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .updated_at' runs-full.json | head -1)
          LAST_SPOT=$(jq -r '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .updated_at' runs-spot.json | head -1)

          if [ -n "$LAST_FULL" ] && [ "$LAST_FULL" != "null" ]; then
            echo "Last full run finished at: $LAST_FULL (UTC)"
            CURRENT_TIME=$(date -u +%s)
            LAST_FULL_TIME=$(date -u -d "$LAST_FULL" +%s)
            TIME_DIFF=$((CURRENT_TIME - LAST_FULL_TIME))
            HOURS_AGO=$((TIME_DIFF / 3600))
            MINUTES_AGO=$(((TIME_DIFF % 3600) / 60))
            echo "Last full run was ${HOURS_AGO}h ${MINUTES_AGO}m ago"
            if [ $TIME_DIFF -gt 3600 ]; then
              echo "Triggering full run..."
              curl -s -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FULL}/dispatches" \
                -d '{"ref":"main"}'
              echo "Triggered full run"
              exit 0
            fi
          else
            echo "No completed full runs found at all"
            exit 1
          fi

          if [ -n "$LAST_SPOT" ] && [ "$LAST_SPOT" != "null" ]; then
            echo "Last spot run finished at: $LAST_SPOT (UTC)"
            CURRENT_TIME=$(date -u +%s)
            LAST_SPOT_TIME=$(date -u -d "$LAST_SPOT" +%s)
            TIME_DIFF=$((CURRENT_TIME - LAST_SPOT_TIME))
            MINUTES_AGO=$((TIME_DIFF / 60))
            echo "Last spot run was ${MINUTES_AGO}m ago"
            if [ $TIME_DIFF -gt 300 ]; then
              echo "Triggering spot run..."
              curl -s -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_SPOT}/dispatches" \
                -d '{"ref":"main"}'
              echo "Triggered spot run"
              exit 0
            fi
          else
            echo "No completed frequent runs found at all"
            exit 1
          fi
          echo "No runs found to trigger .. will check again later"
